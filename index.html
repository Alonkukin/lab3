<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coin Dash — Lab 3 starter</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header><p>LAB 3 · STARTER GAME</p><h1>Coin Dash</h1>
  <p>Collect yellow coins. Dodge red drones. How many can you collect in 45 seconds?</p></header>
  <section id="menu" class="menu" aria-labelledby="menu-title">
    <h2 id="menu-title">Choose your game features</h2>
    <p>Select any combination, or leave them all off for the original game.</p>
    <form id="feature-form">
      <div id="feature-options" class="feature-options"></div>
      <button type="submit">Start game</button>
    </form>
  </section>
  <div id="game" aria-label="Coin Dash game. Move with arrow keys or WASD." hidden></div>
  <div id="game-controls" hidden>
    <p>Move: <strong>arrow keys / WASD</strong> · Restart: <strong>R</strong></p>
    <button id="change-features" type="button">Change features</button>
  </div>
</main>
<script src="vendor/phaser-3.90.0.min.js"></script>
<script src="settings.js"></script><script src="features.js"></script>
<script src="game.js"></script><script src="menu.js"></script>
</body>
</html>
